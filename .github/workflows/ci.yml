name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v13

      - name: Build
        run: nix develop -c npm run build

      - name: Test
        run: nix develop -c npm run test

      - name: Lint
        run: nix develop -c npm run lint

      - name: Flake check
        run: nix flake check
