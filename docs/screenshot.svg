<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Tasks web UI screenshot">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="720" height="420" rx="12" fill="#f5f5f5" filter="url(#shadow)"/>
  <rect x="0" y="0" width="720" height="36" rx="12" fill="#e5e5e5"/>
  <rect x="0" y="18" width="720" height="18" fill="#e5e5e5"/> <!-- flatten bottom radius -->
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <rect x="100" y="10" width="520" height="16" rx="8" fill="#fff"/>

  <!-- App content -->
  <rect x="40" y="60" width="640" height="320" rx="8" fill="#fff"/>

  <!-- Title -->
  <text x="60" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#111">Tasks</text>

  <!-- Input row -->
  <rect x="60" y="125" width="480" height="40" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="72" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#999">What needs to be done?</text>
  <rect x="548" y="125" width="72" height="40" rx="6" fill="#2563eb"/>
  <text x="584" y="151" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#fff">Add</text>

  <!-- Filter buttons -->
  <rect x="60" y="181" width="90" height="32" rx="6" fill="#2563eb"/>
  <text x="105" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#fff">Outstanding</text>
  <rect x="158" y="181" width="82" height="32" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="199" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#333">Completed</text>

  <!-- Task 1 -->
  <rect x="60" y="233" width="560" height="56" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="80" y="267" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#111">Replace the bathroom faucet</text>
  <rect x="452" y="249" width="76" height="28" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="490" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">Complete</text>
  <rect x="536" y="249" width="60" height="28" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="566" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">Delete</text>

  <!-- Task 2 -->
  <rect x="60" y="301" width="560" height="56" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="80" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#111">Pick up dry cleaning</text>
  <rect x="452" y="317" width="76" height="28" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="490" y="336" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">Complete</text>
  <rect x="536" y="317" width="60" height="28" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="566" y="336" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#333">Delete</text>
</svg>
